[project]
name = "trading-ecosystem"
version = "0.1.0"
description = "Multi-agent trend-following trading ecosystem with Master Risk Manager"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15.0",
  "yfinance>=0.2.40",
  "pyyaml>=6.0",
  "pydantic>=2.6",
  "python-dotenv>=1.0",
  "alpaca-py>=0.28",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.3"]

[project.scripts]
te-ingest = "trading_ecosystem.cli:ingest"
te-backtest = "trading_ecosystem.cli:backtest"
te-paper = "trading_ecosystem.cli:paper"
te-monitor = "trading_ecosystem.cli:monitor"
te-discover = "trading_ecosystem.cli:discover"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
