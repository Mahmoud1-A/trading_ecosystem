name: Apply economic fitness and Stress observability hardening

on:
  workflow_dispatch:
  push:
    branches:
      - fix/alpha-budget-drain
    paths:
      - scripts/apply_economic_fitness_and_stress_observability.py
      - scripts/finalize_stress_progress_context.py
      - scripts/fix_full_suite_regressions.py
      - .github/workflows/apply-economic-fitness-hardening.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/apply_economic_fitness_and_stress_observability.py
      - scripts/finalize_stress_progress_context.py
      - scripts/fix_full_suite_regressions.py
      - .github/workflows/apply-economic-fitness-hardening.yml

concurrency:
  group: economic-hardening-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/alpha-budget-drain
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply targeted hardening
        run: |
          python scripts/apply_economic_fitness_and_stress_observability.py
          python scripts/finalize_stress_progress_context.py
          python scripts/fix_full_suite_regressions.py

      - name: Install framework
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./quant_framework[dev]"

      - name: Compile modified runtime modules
        working-directory: quant_framework
        run: python -m compileall -q discovery control_plane tests

      - name: Verify hardening wiring
        run: |
          python - <<'PY'
          from pathlib import Path

          campaign = Path("quant_framework/discovery/multi_family_campaign.py").read_text(encoding="utf-8")
          stress = Path("quant_framework/discovery/stress.py").read_text(encoding="utf-8")
          jobs = Path("quant_framework/control_plane/jobs.py").read_text(encoding="utf-8")
          dsl_test = Path("quant_framework/tests/test_dsl_regime_gate_typing.py").read_text(encoding="utf-8")
          real_test = Path("quant_framework/tests/test_real_data_alpha_miner_backend.py").read_text(encoding="utf-8")

          required_campaign = (
              "STRESS_CANDIDATE_STARTED",
              "STRESS_CANDIDATE_COMPLETED",
              "sync_pending_gate_queues(ckpt)",
              "self._persist_live_checkpoint()",
              '"candidate_index": candidate_index',
              '"total_candidates": len(ordered)',
              "def _reproducible_allocation_payload(",
              '"search_program_id"',
              '_reproducible_allocation_payload(allocation_payload)',
          )
          required_stress = (
              "STRESS_SCENARIO_STARTED",
              "STRESS_SCENARIO_COMPLETED",
              "progress_hook",
              "progress_context",
              "{**self.progress_context, **payload}",
          )
          required_jobs = (
              '"STRESS_CANDIDATE_STARTED": EventType.PROGRESS',
              '"STRESS_SCENARIO_COMPLETED": EventType.PROGRESS',
          )
          assert all(token in campaign for token in required_campaign)
          assert campaign.count('_reproducible_allocation_payload(allocation_payload)') == 2
          assert all(token in stress for token in required_stress)
          assert all(token in jobs for token in required_jobs)
          assert 'state in {"RUNNING", "PAUSED", "COMPLETED"}' in dsl_test
          assert 'state in {"RUNNING", "PAUSED", "COMPLETED"}' in real_test
          PY

      - name: Run repository-contained regressions
        working-directory: quant_framework
        run: |
          python -m pytest -q \
            ../tests/test_quant_robust_fitness_economic.py \
            tests/test_score_qualified_gates.py \
            tests/test_phase3b1_multifamily_stress.py \
            tests/test_phase3c_research_shortlist.py::TestPhase3CCampaign::test_at_least_three_clusters_and_reproducible_shortlist

      - name: Commit generated hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            quant_framework/discovery/fitness.py \
            quant_framework/discovery/multi_family_campaign.py \
            quant_framework/discovery/stress.py \
            quant_framework/control_plane/jobs.py \
            quant_framework/tests/test_dsl_regime_gate_typing.py \
            quant_framework/tests/test_real_data_alpha_miner_backend.py \
            tests/test_quant_robust_fitness_economic.py
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "Fix full-suite lifecycle and fingerprint regressions"
            git fetch origin fix/alpha-budget-drain
            git rebase origin/fix/alpha-budget-drain
            git push origin HEAD:fix/alpha-budget-drain
          fi
