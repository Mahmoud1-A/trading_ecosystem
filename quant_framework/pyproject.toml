[project]
name = "quant-framework"
version = "0.1.0"
description = "Intraday quantitative research and backtesting framework (research-only)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15.0",
  "pydantic>=2.6",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "tzdata>=2024.1",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.3", "mypy>=1.8"]
data_platform = ["polars>=1.0", "duckdb>=1.0"]
mt5 = ["MetaTrader5>=5.0"]
databento = ["databento>=0.40"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "data*", "features*", "discovery*", "portfolio*", "legacy*", "api*", "dashboard*", "control_plane*", "brokers*", "runtime*", "monitoring*", "live*", "governance*", "alpha*", "regime*", "engine*", "risk*", "validation*", "metrics*", "registry*", "reports*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
